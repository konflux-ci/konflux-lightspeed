apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - postgres.yaml
patches:
  - path: patch-deployment.yaml
  - path: configmap-lightspeed-stack.yaml
  - path: configmap-run.yaml
  - target:
      kind: Service
      name: lightspeed-stack
    patch: |-
      - op: replace
        path: /spec/ports/0/name
        value: http
      - op: replace
        path: /spec/ports/0/port
        value: 8080
      - op: replace
        path: /spec/ports/0/targetPort
        value: 8080
images:
  - name: quay.io/lightspeed-core/lightspeed-stack
    newName: quay.io/lightspeed-core/lightspeed-stack
    # lightspeed-stack 0.6.2
    digest: sha256:1317d65e10c34183de36144a8c9effc81a28aacae62f5ba6be448b60ff6cc10d
namespace: konflux-lightspeed
