apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - postgres.yaml
patches:
  - path: patch-deployment.yaml
  - path: configmap-lightspeed-stack.yaml
  - path: configmap-run.yaml
  - target:
      kind: Service
      name: lightspeed-stack
    patch: |-
      - op: replace
        path: /spec/ports/0/name
        value: http
      - op: replace
        path: /spec/ports/0/port
        value: 8080
      - op: replace
        path: /spec/ports/0/targetPort
        value: 8080
images:
  - name: quay.io/lightspeed-core/lightspeed-stack
    newName: quay.io/lightspeed-core/lightspeed-stack
    # lightspeed-stack 0.7.0
    digest: sha256:159f3fb24ed16f026b1a8b9dc035ae122ae8d9897ed2403e4114dce070932ba1
namespace: konflux-lightspeed
