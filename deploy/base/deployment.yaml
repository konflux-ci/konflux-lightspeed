apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-stack
  namespace: konflux-lightspeed
  labels:
    app.kubernetes.io/name: lightspeed-stack
    app.kubernetes.io/part-of: konflux-lightspeed
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lightspeed-stack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lightspeed-stack
        app.kubernetes.io/part-of: konflux-lightspeed
    spec:
      serviceAccountName: lightspeed-stack
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: lightspeed-stack
      containers:
        - name: lightspeed-stack
          # lightspeed-stack 0.7.0
          image: quay.io/lightspeed-core/lightspeed-stack@sha256:159f3fb24ed16f026b1a8b9dc035ae122ae8d9897ed2403e4114dce070932ba1
          # Unified-mode library synthesis writes the generated run.yaml to
          # ./.generated/run.yaml under the read-only image workdir by default,
          # which crashes under readOnlyRootFilesystem. Redirect it to the writable
          # /tmp emptyDir. The matching env var alone is not enough — the parent
          # process clears it unless this CLI flag is passed.
          args:
            - --synthesized-config-output
            - /tmp/ogx/run.yaml
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: LIGHTSPEED_STACK_CONFIG_PATH
              value: /app-root/lightspeed-stack.yaml
            - name: SQLITE_STORE_DIR
              value: /tmp/llama-store
            # lightspeed-stack 0.7 enables OpenTelemetry tracing by default, which
            # requires OTEL_ANONYMIZATION_SECRET. We don't ship an OTel collector,
            # so disable the SDK. Remove this to enable tracing (and set the secret).
            - name: OTEL_SDK_DISABLED
              value: "true"
          envFrom: []
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: lightspeed-stack-config
              mountPath: /app-root/lightspeed-stack.yaml
              subPath: lightspeed-stack.yaml
              readOnly: true
            - name: run-config
              mountPath: /app-root/run.yaml
              subPath: run.yaml
              readOnly: true
            - name: system-prompt
              mountPath: /app-root/system-prompt.txt
              subPath: system-prompt.txt
              readOnly: true
            - name: tls-certs
              mountPath: /app-root/tls
              readOnly: true
            - name: llm-credentials
              mountPath: /app-root/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: lightspeed-stack-config
          configMap:
            name: lightspeed-stack-config
        - name: run-config
          configMap:
            name: run-config
        - name: system-prompt
          configMap:
            name: system-prompt
        - name: tls-certs
          secret:
            secretName: lightspeed-tls
        - name: llm-credentials
          secret:
            secretName: llm-provider-credentials
        - name: tmp
          emptyDir: {}
