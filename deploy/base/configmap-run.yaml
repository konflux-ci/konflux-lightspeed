apiVersion: v1
kind: ConfigMap
metadata:
  name: run-config
  namespace: konflux-lightspeed
data:
  run.yaml: |
    version: 2
    distro_name: konflux-lightspeed
    external_providers_dir: ${env.EXTERNAL_PROVIDERS_DIR:=~/.llama/providers.d}
    # RAG is served by KOD over MCP (tool_runtime). The vector_io + files providers
    # are kept only because the responses (inline::builtin) provider requires them;
    # the embedding stack (sentence-transformers / file_search / vector_stores) is
    # omitted, so no embedding model is downloaded at runtime.
    apis:
      - responses
      - conversations
      - files
      - inference
      - tool_runtime
      - vector_io
    providers:
      inference:
        - provider_id: PLACEHOLDER_PROVIDER_ID
          provider_type: PLACEHOLDER_PROVIDER_TYPE
          config: {}
      responses:
        - provider_id: meta-reference
          provider_type: inline::builtin
          config:
            persistence:
              responses:
                backend: sql_default
                table_name: agents_responses
      files:
        - provider_id: localfs
          provider_type: inline::localfs
          config:
            storage_dir: ${env.SQLITE_STORE_DIR:=~/.llama/storage}/files
            metadata_store:
              table_name: files_metadata
              backend: sql_default
      tool_runtime:
        - provider_id: model-context-protocol
          provider_type: remote::model-context-protocol
          config: {}
      vector_io:
        - provider_id: faiss
          provider_type: inline::faiss
          config:
            persistence:
              namespace: vector_io::faiss
              backend: kv_default
    storage:
      backends:
        kv_default:
          type: kv_postgres
          host: PLACEHOLDER_PG_HOST
          port: "5432"
          db: PLACEHOLDER_PG_DB
          user: PLACEHOLDER_PG_USER
          password: PLACEHOLDER_PG_PASSWORD
          table_name: llamastack_kvstore
        sql_default:
          type: sql_postgres
          host: PLACEHOLDER_PG_HOST
          port: "5432"
          db: PLACEHOLDER_PG_DB
          user: PLACEHOLDER_PG_USER
          password: PLACEHOLDER_PG_PASSWORD
          table_name: llamastack_sqlstore
      stores:
        metadata:
          namespace: registry
          backend: kv_default
        inference:
          table_name: inference_store
          backend: sql_default
          max_write_queue_size: 10000
          num_writers: 4
        conversations:
          table_name: openai_conversations
          backend: sql_default
        prompts:
          table_name: prompts
          backend: sql_default
        connectors:
          table_name: connectors
          backend: sql_default
    registered_resources:
      models:
        - metadata: {}
          model_id: PLACEHOLDER_MODEL_ID
          provider_id: PLACEHOLDER_PROVIDER_ID
          provider_model_id: PLACEHOLDER_MODEL_ID
          model_type: llm
      vector_stores: []
    server:
      port: 8321
