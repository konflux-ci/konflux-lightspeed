apiVersion: v1
kind: ConfigMap
metadata:
  name: run-config
  namespace: konflux-lightspeed
data:
  run.yaml: |
    version: 2
    distro_name: konflux-lightspeed
    external_providers_dir: ${env.EXTERNAL_PROVIDERS_DIR:=~/.llama/providers.d}
    apis:
      - agents
      - conversations
      - files
      - file_processors
      - inference
      - safety
      - tool_runtime
      - vector_io
    providers:
      inference:
        - provider_id: PLACEHOLDER_PROVIDER_ID
          provider_type: PLACEHOLDER_PROVIDER_TYPE
          config: {}
      agents:
        - provider_id: meta-reference
          provider_type: inline::meta-reference
          config:
            persistence:
              agent_state:
                backend: kv_default
                namespace: agents
              responses:
                backend: sql_default
                table_name: agents_responses
      files:
        - provider_id: localfs
          provider_type: inline::localfs
          config:
            storage_dir: ${env.SQLITE_STORE_DIR:=~/.llama/storage}/files
            metadata_store:
              table_name: files_metadata
              backend: sql_default
      file_processors:
        - provider_id: pypdf
          provider_type: inline::pypdf
          config:
            default_chunk_size_tokens: 800
            default_chunk_overlap_tokens: 400
      tool_runtime:
        - provider_id: model-context-protocol
          provider_type: remote::model-context-protocol
          config: {}
        - provider_id: rag-runtime
          provider_type: inline::rag-runtime
          config: {}
      vector_io:
        - provider_id: faiss
          provider_type: inline::faiss
          config:
            persistence:
              namespace: vector_io::faiss
              backend: kv_default
    storage:
      backends:
        kv_default:
          type: kv_postgres
          host: PLACEHOLDER_PG_HOST
          port: "5432"
          db: PLACEHOLDER_PG_DB
          user: PLACEHOLDER_PG_USER
          password: PLACEHOLDER_PG_PASSWORD
          table_name: llamastack_kvstore
        sql_default:
          type: sql_postgres
          host: PLACEHOLDER_PG_HOST
          port: "5432"
          db: PLACEHOLDER_PG_DB
          user: PLACEHOLDER_PG_USER
          password: PLACEHOLDER_PG_PASSWORD
          table_name: llamastack_sqlstore
      stores:
        metadata:
          namespace: registry
          backend: kv_default
        inference:
          table_name: inference_store
          backend: sql_default
          max_write_queue_size: 10000
          num_writers: 4
        conversations:
          table_name: openai_conversations
          backend: sql_default
        prompts:
          namespace: prompts
          backend: kv_default
        connectors:
          namespace: connectors
          backend: kv_default
    registered_resources:
      models:
        - metadata: {}
          model_id: PLACEHOLDER_MODEL_ID
          provider_id: PLACEHOLDER_PROVIDER_ID
          provider_model_id: PLACEHOLDER_MODEL_ID
          model_type: llm
      vector_stores: []
    server:
      port: 8321
