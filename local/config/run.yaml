version: 2
distro_name: konflux-lightspeed-local
external_providers_dir: ${env.EXTERNAL_PROVIDERS_DIR:=~/.llama/providers.d}
# RAG is served by KOD over MCP (tool_runtime). The vector_io + files providers
# are kept only because the responses (inline::builtin) provider requires them; the
# embedding stack (sentence-transformers / file_search / vector_stores) is omitted,
# so no embedding model is downloaded at runtime.
apis:
  - responses
  - conversations
  - files
  - inference
  - tool_runtime
  - vector_io
providers:
  inference:
    # OpenAI — active for the local KOD RAG test. Sidesteps the Gemini 3
    # thought_signature defect entirely (remote::gemini drops it via Google's
    # OpenAI-compat endpoint; remote::vertexai hit it too on llama-stack 0.6.0).
    - provider_id: openai
      provider_type: remote::openai
      config:
        api_key: ${env.OPENAI_API_KEY}
    # Alternative: Google Vertex AI. Needs GCP roles/aiplatform.user.
    # On lightspeed-stack 0.7+ this works out of the box; on 0.6.x it also needs a
    # local converter override for the Gemini 3 thought_signature round-trip.
    # - provider_id: google-vertex
    #   provider_type: remote::vertexai
    #   config:
    #     project: ${env.VERTEXAI_PROJECT_ID}
    #     location: ${env.VERTEX_AI_LOCATION}
    # Alternative: Google Gemini API (AI Studio key) — no tool-calling (see above)
    # - provider_id: gemini
    #   provider_type: remote::gemini
    #   config:
    #     api_key: ${env.GEMINI_API_KEY}
  responses:
    - provider_id: meta-reference
      provider_type: inline::builtin
      config:
        persistence:
          responses:
            backend: sql_default
            table_name: agents_responses
  files:
    - provider_id: localfs
      provider_type: inline::localfs
      config:
        storage_dir: ${env.SQLITE_STORE_DIR}/files
        metadata_store:
          table_name: files_metadata
          backend: sql_default
  tool_runtime:
    - provider_id: model-context-protocol
      provider_type: remote::model-context-protocol
      config: {}
  # Required by the responses (inline::builtin) provider. No embedding model is
  # configured (no sentence-transformers / vector_stores), so nothing is downloaded
  # at runtime — RAG is served by KOD over MCP.
  vector_io:
    - provider_id: faiss
      provider_type: inline::faiss
      config:
        persistence:
          namespace: vector_io::faiss
          backend: kv_default

storage:
  backends:
    kv_default:
      type: kv_sqlite
      db_path: ${env.SQLITE_STORE_DIR}/kv_store.db
    sql_default:
      type: sql_sqlite
      db_path: ${env.SQLITE_STORE_DIR}/sql_store.db
  stores:
    metadata:
      namespace: registry
      backend: kv_default
    inference:
      table_name: inference_store
      backend: sql_default
      max_write_queue_size: 10000
      num_writers: 4
    conversations:
      table_name: openai_conversations
      backend: sql_default
    prompts:
      table_name: prompts
      backend: sql_default
    connectors:
      table_name: connectors
      backend: sql_default
# Model names must use full SDK-native format for Vertex AI
# See: https://github.com/meta-llama/llama-stack/pull/5169
registered_resources:
  models:
    - metadata: {}
      model_id: gpt-4o-mini
      provider_id: openai
      provider_model_id: gpt-4o-mini
      model_type: llm
    # When using Vertex AI instead:
    # - metadata: {}
    #   model_id: publishers/google/models/gemini-3.1-flash-lite
    #   provider_id: google-vertex
    #   provider_model_id: publishers/google/models/gemini-3.1-flash-lite
    #   model_type: llm
    # When using the Gemini API instead:
    # - metadata: {}
    #   model_id: models/gemini-3.1-flash-lite
    #   provider_id: gemini
    #   provider_model_id: models/gemini-3.1-flash-lite
    #   model_type: llm
  vector_stores: []

server:
  port: 8321
