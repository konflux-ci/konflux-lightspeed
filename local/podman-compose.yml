# Local podman-compose deployment for konflux-lightspeed
#
# Quick start:
#   cp ../.env.example ../.env   # edit with your LLM provider credentials
#   podman-compose up -d
#   podman-compose ps            # wait for all services to show "healthy"
#   curl http://localhost:8080/liveness
#
# Service dependency chain:
#   postgres, kod → lightspeed-stack

services:
  postgres:
    # postgres:16-alpine
    image: docker.io/library/postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: konflux-lightspeed-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lightspeed}
      POSTGRES_USER: ${POSTGRES_USER:-lightspeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lightspeed}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - lightspeed-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lightspeed", "-d", "lightspeed"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  kod:
    # KOD (Konflux Offline Documentation) — MCP server, rebuilt daily in Konflux CI.
    # Track the :latest tag so local dev picks up the newest daily build (fresh docs
    # + code). pull_policy: always re-checks the registry on each `up` (fast when the
    # local image already matches the published digest).
    image: quay.io/redhat-user-workloads-stage/kod-tenant/kod:latest
    pull_policy: always
    container_name: konflux-lightspeed-kod
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - lightspeed-net
    healthcheck:
      # Distroless image — no shell; use the bundled venv Python for a TCP check.
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import socket; s = socket.create_connection(('127.0.0.1', 8000), timeout=3); s.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  lightspeed-stack:
    # lightspeed-stack 0.7.0
    image: quay.io/lightspeed-core/lightspeed-stack@sha256:159f3fb24ed16f026b1a8b9dc035ae122ae8d9897ed2403e4114dce070932ba1
    container_name: konflux-lightspeed-stack
    env_file: ../.env
    # Redirect unified-mode synthesis to writable /tmp (see deploy/base/deployment.yaml).
    command: ["--synthesized-config-output", "/tmp/ogx/run.yaml"]
    # Mirror the production securityContext (readOnlyRootFilesystem: true) so local
    # dev catches read-only-filesystem issues. Only /tmp is writable.
    read_only: true
    tmpfs:
      - /tmp
    environment:
      LIGHTSPEED_STACK_CONFIG_PATH: /app-root/lightspeed-stack.yaml
      LIGHTSPEED_STACK_LOG_LEVEL: DEBUG
      # lightspeed-stack 0.7 enables OpenTelemetry tracing by default, which
      # requires OTEL_ANONYMIZATION_SECRET. Disable the SDK for local dev.
      OTEL_SDK_DISABLED: "true"
      # Vertex AI auth (only needed for the remote::vertexai provider). Re-enable
      # this + the two Vertex volume mounts below when using the Vertex provider.
      # GOOGLE_APPLICATION_CREDENTIALS: /etc/gcp/credentials.json
      # Writable path for llama-stack internal SQLite registry
      # (workaround for https://github.com/llamastack/llama-stack/issues/4896)
      SQLITE_STORE_DIR: /tmp/llama-store
      # PostgreSQL connection — references the postgres service by DNS name
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-lightspeed}
      POSTGRES_USER: ${POSTGRES_USER:-lightspeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lightspeed}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/run.yaml:/app-root/run.yaml:ro,Z
      - ./config/lightspeed-stack.yaml:/app-root/lightspeed-stack.yaml:ro,Z
      - ./config/system-prompt.txt:/app-root/system-prompt.txt:ro,Z
      # --- Vertex AI only (currently inactive; provider is openai) ---
      # Vertex AI service-account key (set GCP_CREDENTIALS_PATH in ../.env).
      # - ${GCP_CREDENTIALS_PATH}:/etc/gcp/credentials.json:ro,Z
    networks:
      - lightspeed-net
    depends_on:
      postgres:
        condition: service_healthy
      kod:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import socket; s = socket.create_connection(('127.0.0.1', 8080), timeout=3); s.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  lightspeed-net:

volumes:
  pgdata:
